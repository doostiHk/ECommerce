services:
  keycloak-db:
    ports:
      - "5433:5432"

  keycloak:
    ports:
      - "8080:8080"
    environment:
      # Service-name hostname so container JWKS/issuer URLs stay reachable on the Docker network.
      # Clients should authenticate via Gateway /auth/login (not by calling Keycloak from the host).
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  seq:
    environment:
      - SEQ_FIRSTRUN_ADMIN_PASSWORD=${SEQ_ADMIN_PASSWORD:-seq_strong}
    ports:
      - "5341:80"

  product-db:
    ports:
      - "5434:5432"

  order-db:
    ports:
      - "5435:5432"

  notification-db:
    ports:
      - "5436:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: gateway/Gateway.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7000
      - Keycloak__Authority=http://keycloak:8080/realms/Core
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/Core/.well-known/openid-configuration
      - Keycloak__ClientId=${KEYCLOAK_CLIENT_ID:-web-frontend}
      - Keycloak__AdminUsername=${KEYCLOAK_ADMIN:-admin}
      - Keycloak__AdminPassword=${KEYCLOAK_ADMIN_PASSWORD:-admin_strong}
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__ValidIssuers__0=http://keycloak:8080/realms/Core
      - Keycloak__ValidIssuers__1=http://localhost:8080/realms/Core
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:5173
      - Cors__AllowedOrigins__2=http://localhost:7000
      - ReverseProxy__Clusters__product-cluster__Destinations__d1__Address=http://product-service:7002/
      - ReverseProxy__Clusters__order-cluster__Destinations__d1__Address=http://order-service:7003/
      - ReverseProxy__Clusters__notification-cluster__Destinations__d1__Address=http://notification-service:7004/
    ports:
      - "7000:7000"

  product-service:
    build:
      context: .
      dockerfile: services/product/Product.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7002
      - ConnectionStrings__Default=Host=product-db;Port=5432;Database=product;Username=product;Password=${PRODUCT_DB_PASSWORD:-Product@123}
      - Keycloak__Authority=http://keycloak:8080/realms/Core
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/Core/.well-known/openid-configuration
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__ValidIssuers__0=http://keycloak:8080/realms/Core
      - Keycloak__ValidIssuers__1=http://localhost:8080/realms/Core
      - Keycloak__Admin__Realm=Core
      - Keycloak__Admin__ClientId=product-service
      - Keycloak__Admin__ClientSecret=${PRODUCT_SERVICE_CLIENT_SECRET:-product-service-secret}
      - Keycloak__Admin__Username=${KEYCLOAK_ADMIN:-admin}
      - Keycloak__Admin__Password=${KEYCLOAK_ADMIN_PASSWORD:-admin_strong}
      - RabbitMq__Host=rabbitmq
      - Seq__Url=http://seq:80
    ports:
      - "7002:7002"
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order/Order.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7003
      - ConnectionStrings__Default=Host=order-db;Port=5432;Database=order;Username=order;Password=${ORDER_DB_PASSWORD}
      - Keycloak__Authority=http://keycloak:8080/realms/Core 
      - RabbitMq__Host=rabbitmq
      - Seq__Url=http://seq:80
    ports:
      - "7003:7003"

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Notification.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7004
      - ConnectionStrings__Default=Host=notification-db;Port=5432;Database=notification;Username=notification;Password=${NOTIFICATION_DB_PASSWORD}
      - Keycloak__Authority=http://keycloak:8080/realms/Core 
      - RabbitMq__Host=rabbitmq
      - Seq__Url=http://seq:80
    ports:
      - "7004:7004"